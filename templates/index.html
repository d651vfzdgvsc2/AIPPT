<!DOCTYPE html>
<html lang="zh-CN" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt 定制助手 - 带图片理解</title>
    <style>
        :root {
            --bg: #FBFAF7; --surface: #FFFFFF; --ink: #0B0F0E; --muted: #6C756F;
            --line: #E6E6E6; --accent: #2F746C; --accent-dark: #21564F;
            --accent-soft: #E6F1EF; --soft: #F7F6F2;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", Inter, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .app {
            max-width: 1200px; height: 100vh; margin: 0 auto;
            display: grid; grid-template-columns: 430px minmax(0, 1fr);
            background: var(--surface);
            border-left: 1px solid var(--line); border-right: 1px solid var(--line);
        }
        .panel {
            border-right: 1px solid var(--line); padding: 26px 26px 20px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 22px;
        }
        .stage { padding: 26px 30px; overflow-y: auto; }

        .brandbar { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: #fff;
            display: grid; place-items: center; font-size: 18px; flex: none;
        }
        .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
        .brand-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
        .lang {
            margin-left: auto; border: 1px solid var(--line); background: #fff; border-radius: 9px;
            padding: 6px 11px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer;
        }
        .lang:hover { border-color: var(--ink); color: var(--ink); }

        .step { display: flex; flex-direction: column; gap: 10px; }
        .step-head {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; font-weight: 800; color: var(--muted);
            letter-spacing: 0.06em; text-transform: uppercase;
        }
        .step-head .num {
            width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: #fff;
            display: grid; place-items: center; font-size: 11px; flex: none;
        }
        .linkbtn { margin-left: auto; border: none; background: none; color: var(--accent);
                   font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 0; text-transform: none; }
        .linkbtn:disabled { opacity: .45; cursor: default; }

        .tpl-row { display: flex; gap: 7px; flex-wrap: wrap; }
        .tpl-chip {
            padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff;
            color: #3f434b; font: 12px inherit; cursor: pointer; transition: all .15s ease;
        }
        .tpl-chip:hover { border-color: var(--ink); color: var(--ink); background: var(--soft); }

        textarea {
            width: 100%; padding: 14px 15px; border: 1px solid var(--line); border-radius: 14px;
            font: 14px/1.6 inherit; color: var(--ink); background: var(--soft); resize: vertical;
            transition: all .15s ease;
        }
        textarea::placeholder { color: #A7AAB1; }
        textarea:focus { outline: none; border-color: var(--accent); background: #fff;
                         box-shadow: 0 0 0 4px rgba(47,116,108,.14); }

        .upload-zone {
            position: relative; border: 1.5px dashed #CFCDC6; border-radius: 14px;
            padding: 22px 16px; text-align: center; cursor: pointer; background: var(--soft);
            transition: all .15s ease;
        }
        .upload-zone:hover { border-color: var(--accent); background: #fff; }
        .upload-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
        .upload-zone.has-image { border-style: solid; padding: 12px; }
        .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-icon { display: block; font-size: 22px; color: var(--muted); margin-bottom: 6px; }
        .upload-text { font-size: 13px; color: #4b4f57; }
        .upload-text strong { color: var(--accent); }
        .upload-hint { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

        .preview-wrap { display: none; position: relative; }
        .preview-wrap.visible { display: block; }
        .preview-wrap img { max-width: 100%; max-height: 200px; border-radius: 12px;
                            border: 1px solid var(--line); display: block; }
        .clear-btn {
            position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
            border: none; background: rgba(20,22,26,.6); color: #fff; font-size: 15px;
            line-height: 26px; text-align: center; cursor: pointer;
        }
        .clear-btn:hover { background: rgba(20,22,26,.85); }

        .palette-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .swatch { text-align: center; font-size: 11px; color: var(--muted); }
        .swatch input[type=color] {
            display: block; width: 56px; height: 40px; border: 1px solid var(--line);
            border-radius: 11px; background: #fff; padding: 3px; cursor: pointer;
        }
        .spec-empty { font-size: 12.5px; color: var(--muted); }
        .style-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .style-fields label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
        .style-fields input {
            width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px;
            font: 13px inherit; color: var(--ink); background: var(--soft);
        }
        .style-fields input::placeholder { color: #A7AAB1; }
        .style-fields input:focus { outline: none; border-color: var(--accent); background: #fff;
                                    box-shadow: 0 0 0 4px rgba(47,116,108,.14); }

        .cta { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 8px; }
        .btn-primary {
            width: 100%; padding: 15px; border: none; border-radius: 14px; background: var(--accent);
            color: #fff; font: 15px inherit; font-weight: 700; cursor: pointer; transition: all .15s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: .2px;
        }
        .btn-primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .btn-ghost {
            width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 14px;
            background: #fff; color: #3f434b; font: 14px inherit; font-weight: 600; cursor: pointer;
            transition: all .15s ease;
        }
        .btn-ghost:hover { border-color: var(--ink); color: var(--ink); }

        .stage-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .stage-title { font-size: 12.5px; font-weight: 800; color: var(--muted);
                       letter-spacing: 0.06em; text-transform: uppercase; }
        .stage-meta { font-size: 12px; color: var(--muted); }
        .result-area {
            min-height: 240px; padding: 20px; border: 1px solid var(--line); border-radius: 16px;
            background: #fff; line-height: 1.75; font-size: 14.5px; white-space: pre-wrap;
            word-break: break-word; color: var(--ink);
        }
        .result-area.has-content { border-color: #DEDCD5; }
        .result-area .placeholder { color: #A7AAB1; }
        .result-area .error { color: #E11D48; font-weight: 600; }
        .result-area .thinking { color: var(--muted); }

        .result-actions { display: none; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .result-actions.visible { display: flex; }
        .result-actions .char-count { font-size: 12px; color: var(--muted); }
        .mini-btn {
            padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
            color: #3f434b; font: 12.5px inherit; font-weight: 600; cursor: pointer; transition: all .15s ease;
            margin: 0;
        }
        .mini-btn:hover { border-color: var(--ink); color: var(--ink); }
        .mini-btn.refine { border-color: #BBF7D0; color: #047857; background: #F0FDF4; }
        .mini-btn.refine:hover { background: #DCFCE7; border-color: #86EFAC; }

        .history-section { margin-top: 24px; display: none; }
        .history-section.visible { display: block; }
        .history-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .history-title { font-size: 12.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
        .history-clear { border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer; }
        .history-clear:hover { color: #E11D48; }
        .history-item {
            padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px;
            cursor: pointer; background: #fff; transition: all .15s ease;
        }
        .history-item:hover { border-color: var(--accent); }
        .history-item .h-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
        .history-item .h-text {
            font-size: 13px; color: #3f434b; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .qr-overlay { display: none; position: fixed; inset: 0; background: rgba(10,12,16,.55);
                      z-index: 1000; align-items: center; justify-content: center; }
        .qr-overlay.visible { display: flex; }
        .qr-modal { background: #fff; border-radius: 20px; padding: 28px; text-align: center;
                    box-shadow: 0 20px 60px rgba(0,0,0,.18); max-width: 300px; width: 90%; }
        .qr-modal img { width: 200px; height: 200px; object-fit: contain; display: block;
                        margin: 0 auto 12px; border-radius: 8px; background: #f1f5f9; }
        .qr-label { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .qr-hint { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
        .qr-close { padding: 8px 22px; border: 1px solid var(--line); border-radius: 9px;
                    background: #fff; font: 13px inherit; cursor: pointer; }
        .qr-close:hover { border-color: var(--ink); }

        .hidden-tools { display: none; }

        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; height: auto; }
            .panel { border-right: none; border-bottom: 1px solid var(--line); }
        }
    </style>
</head>
<body>

<div class="app">
    <aside class="panel">
        <div class="brandbar">
            <div class="logo">&#9670;</div>
            <div>
                <div class="brand">DeckCraft</div>
                <div class="brand-sub" data-i18n="subtitle">参考图 &#8594; 拆解设计规范 &#8594; 直接产出可下载的 PPT</div>
            </div>
            <button class="lang" id="langToggle">EN</button>
        </div>

        <section class="step">
            <div class="step-head"><span class="num">1</span><span data-i18n="descLabel">需求描述</span></div>
            <div class="tpl-row" id="tplRow"></div>
            <textarea id="userInput" rows="4" data-i18n-placeholder="descPlaceholder" placeholder="输入你想定制的prompt，或点上方模板快速开始"></textarea>
        </section>

        <section class="step">
            <div class="step-head"><span class="num">2</span><span data-i18n="uploadLabel">上传图片（可选）</span></div>
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp">
                <span class="upload-icon">&#8963;</span>
                <div class="upload-text" data-i18n="uploadText">拖拽图片到此处，或 <strong data-i18n="uploadClick">点击选择文件</strong></div>
                <div class="upload-hint" data-i18n="uploadHint">支持 JPG / PNG / WebP，大图会自动压缩</div>
            </div>
            <div class="preview-wrap" id="previewWrap">
                <img id="imagePreview" alt="image preview">
                <button class="clear-btn" id="clearBtn">&times;</button>
            </div>
        </section>

        <section class="step">
            <div class="step-head">
                <span class="num">3</span><span>设计规范</span>
                <button class="linkbtn" id="analyzeBtn" type="button">拆解参考图</button>
            </div>
            <div id="paletteRow" class="palette-row"><span class="spec-empty">上传参考图后点「拆解参考图」得到配色与风格，可直接编辑；或直接「生成演示」用默认规范。</span></div>
            <div id="styleFields" class="style-fields" style="display:none">
                <div><label>主题 / 气质</label><input id="f-theme" placeholder="如：沉稳商务"></div>
                <div><label>版式特征</label><input id="f-layout" placeholder="如：大标题 + 要点列表"></div>
                <div><label>字体与层级</label><input id="f-typography" placeholder="如：无衬线，标题特粗"></div>
                <div><label>强调色用法</label><input id="f-accent" placeholder="如：主色用于标题，强调色用于数据"></div>
            </div>
        </section>

        <div class="cta">
            <button class="btn-primary" id="pptxBtn" type="button"><span>生成演示 · PPT</span></button>
            <button class="btn-ghost" id="generateBtn" type="button"><span data-i18n="generateBtn">生成 Prompt</span></button>
        </div>
    </aside>

    <main class="stage">
        <div class="stage-top">
            <div class="stage-title">输出</div>
            <div class="stage-meta">Planner &#183; 设计规范 &#183; python-pptx</div>
        </div>
        <div class="result-area" id="resultArea">
            <span class="placeholder" data-i18n="resultPlaceholder">等待生成...</span>
        </div>
        <div class="result-actions" id="resultActions">
            <button class="mini-btn" id="copyBtn" data-i18n="copy">&#128203; 复制</button>
            <button class="mini-btn refine" id="refineBtn" data-i18n="refine">&#128260; 再优化一版</button>
            <span class="char-count" id="charCount"></span>
        </div>
        <div class="history-section" id="historySection">
            <div class="history-head">
                <span class="history-title" data-i18n="historyTitle">历史记录（最近 20 条）</span>
                <button class="history-clear" id="historyClear" data-i18n="historyClear">清空</button>
            </div>
            <div id="historyList"></div>
        </div>
    </main>
</div>

<div class="hidden-tools">
    <button id="vipBtn"></button>
    <button id="sponsorWechat"></button>
    <button id="sponsorAlipay"></button>
    <a id="sponsorBmac" href="#" target="_blank" rel="noopener"></a>
</div>

<div class="qr-overlay" id="qrOverlay">
    <div class="qr-modal">
        <img id="qrImage" src="" alt="QR Code">
        <div class="qr-label" id="qrLabel">微信收款码</div>
        <div class="qr-hint" data-i18n="qrHint">扫码赞助，感谢支持</div>
        <button class="qr-close" id="qrClose" data-i18n="qrClose">关闭</button>
    </div>
</div>

<script>
    const userInput = document.getElementById('userInput');
    const imageInput = document.getElementById('imageInput');
    const uploadZone = document.getElementById('uploadZone');
    const imagePreview = document.getElementById('imagePreview');
    const previewWrap = document.getElementById('previewWrap');
    const clearBtn = document.getElementById('clearBtn');
    const generateBtn = document.getElementById('generateBtn');
    const resultArea = document.getElementById('resultArea');
    const resultActions = document.getElementById('resultActions');
    const copyBtn = document.getElementById('copyBtn');
    const refineBtn = document.getElementById('refineBtn');
    const charCount = document.getElementById('charCount');
    const historySection = document.getElementById('historySection');
    const historyList = document.getElementById('historyList');
    const historyClear = document.getElementById('historyClear');
    const langToggle = document.getElementById('langToggle');
    const vipBtn = document.getElementById('vipBtn');
    const htmlTag = document.getElementById('htmlTag');
    const sponsorWechat = document.getElementById('sponsorWechat');
    const sponsorAlipay = document.getElementById('sponsorAlipay');
    const sponsorBmac = document.getElementById('sponsorBmac');
    const qrOverlay = document.getElementById('qrOverlay');
    const qrImage = document.getElementById('qrImage');
    const qrLabel = document.getElementById('qrLabel');
    const qrClose = document.getElementById('qrClose');
    const tplRow = document.getElementById('tplRow');

    let base64Image = null;
    let lang = 'zh';
    let lastPrompt = '';      // 上一次生成结果（供"再优化一版"用）
    let generating = false;

    // ===================== 场景模板 =====================
    const TEMPLATES = {
        zh: [
            { name: '工作汇报', text: '帮我生成一份「季度工作汇报」PPT 的提示词：面向部门领导，包含目标回顾、关键成果（用数据说话）、问题与反思、下季度计划四个部分，风格专业简洁，蓝色商务配色。' },
            { name: '产品发布', text: '帮我生成一份「新产品发布会」PPT 的提示词：面向媒体和客户，包含行业痛点、产品亮点（对比表格）、演示截图、价格与上市计划，风格科技感强，深色背景。' },
            { name: '教学课件', text: '帮我生成一份教学课件的提示词：面向大学生，主题由我后续指定，包含学习目标、知识点讲解（每页一个概念+例子）、课堂互动问题、小结，风格清新易读，配图丰富。' },
            { name: '路演融资', text: '帮我生成一份创业项目融资路演 PPT 的提示词：面向投资人，包含痛点、解决方案、市场规模、商业模式、进展数据、团队、融资计划，风格简洁有力，10页以内。' },
            { name: '年终总结', text: '帮我生成一份「个人年终总结」PPT 的提示词：包含全年工作亮点、量化成绩、成长与不足、明年规划，风格温暖有感染力，适合汇报展示。' },
            { name: '培训分享', text: '帮我生成一份内部分享 PPT 的提示词：面向同事的技术/经验分享，包含背景引入、核心方法（分步骤）、案例演示、避坑建议、参考资料，风格轻松专业。' },
        ],
        en: [
            { name: 'Work Report', text: 'Generate a prompt for a quarterly work report PPT: for department leaders, covering goals review, key results (data-driven), reflections, and next quarter plan. Professional style, business blue palette.' },
            { name: 'Product Launch', text: 'Generate a prompt for a product launch PPT: for media and customers, covering pain points, product highlights (comparison table), demo screenshots, pricing and launch plan. Tech-savvy style, dark background.' },
            { name: 'Courseware', text: 'Generate a prompt for a teaching PPT: for college students, with learning objectives, one concept per page with examples, in-class questions, and summary. Clean and readable style.' },
            { name: 'Pitch Deck', text: 'Generate a prompt for a startup fundraising pitch deck: for investors, covering problem, solution, market size, business model, traction, team, and ask. Concise and powerful, under 10 slides.' },
        ]
    };

    function renderTemplates() {
        tplRow.innerHTML = '';
        TEMPLATES[lang].forEach(tpl => {
            const chip = document.createElement('button');
            chip.className = 'tpl-chip';
            chip.textContent = tpl.name;
            chip.addEventListener('click', () => { userInput.value = tpl.text; userInput.focus(); });
            tplRow.appendChild(chip);
        });
    }

    // ===================== i18n =====================
    const i18n = {
        zh: {
            title: 'DeckCraft · 演示设计工作流',
            subtitle: '参考图 → 拆解设计规范 → 直接产出可下载的 PPT',
            descLabel: '需求描述',
            descPlaceholder: '输入你想定制的prompt，或点上方模板快速开始',
            uploadLabel: '上传图片（可选）',
            uploadText: '拖拽图片到此处，或 ',
            uploadClick: '点击选择文件',
            uploadHint: '支持 JPG / PNG / WebP，大图会自动压缩',
            generateBtn: '生成 Prompt',
            resultPlaceholder: '等待生成...',
            vip: '升级会员',
            imgSelected: '已选择图片，点击可更换',
            alertNoInput: '请填写需求或上传图片',
            thinking: '🤖 AI 思考中...',
            errorPrefix: '错误：',
            errorNetwork: '网络错误：',
            vipAlert: '会员功能即将开放，敬请期待！',
            sponsorLabel: '❤️ 支持作者',
            qrHint: '扫码赞助，感谢支持',
            qrClose: '关闭',
            copy: '复制',
            copied: '✅ 已复制到剪贴板',
            copyFail: '复制失败，请手动选择复制',
            refine: '再优化一版',
            refinePlaceholder: '想怎么改？例如：更专业一点 / 加一页数据对比 / 换成科技风...',
            refineHint: '🔄 优化模式：输入修改意见后点生成，AI 会在上一版基础上修改',
            historyTitle: '🕘 历史记录（最近 20 条）',
            historyClear: '清空',
            historyEmpty: '暂无历史记录',
            chars: '字',
            refineLabel: '优化',
            freshLabel: '全新',
        },
        en: {
            title: 'DeckCraft · Deck Design Workflow',
            subtitle: 'Reference image → design spec → downloadable PPT',
            descLabel: 'Description',
            descPlaceholder: 'Enter your custom prompt, or pick a template above',
            uploadLabel: 'Upload Image (Optional)',
            uploadText: 'Drag image here, or ',
            uploadClick: 'click to select',
            uploadHint: 'Supports JPG / PNG / WebP, large images are compressed',
            generateBtn: 'Generate Prompt',
            resultPlaceholder: 'Awaiting generation...',
            vip: 'Upgrade',
            imgSelected: 'Image selected, click to change',
            alertNoInput: 'Please fill in requirements or upload an image',
            thinking: '🤖 AI thinking...',
            errorPrefix: 'Error: ',
            errorNetwork: 'Network error: ',
            vipAlert: 'Membership feature coming soon!',
            sponsorLabel: '❤️ Support the Author',
            qrHint: 'Scan to sponsor, thank you! ❤️',
            qrClose: 'Close',
            copy: 'Copy',
            copied: '✅ Copied to clipboard',
            copyFail: 'Copy failed, please select manually',
            refine: 'Refine',
            refinePlaceholder: 'How to improve? e.g. more professional / add a data slide / tech style...',
            refineHint: '🔄 Refine mode: type your feedback and generate — AI will revise the last version',
            historyTitle: '🕘 History (last 20)',
            historyClear: 'Clear',
            historyEmpty: 'No history yet',
            chars: 'chars',
            refineLabel: 'Refined',
            freshLabel: 'New',
        }
    };

    function applyLang() {
        const t = i18n[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (t[key] !== undefined) {
                if (key === 'uploadText') {
                    el.innerHTML = t[key] + '<strong>' + t.uploadClick + '</strong>';
                } else {
                    el.textContent = t[key];
                }
            }
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.dataset.i18nPlaceholder;
            if (t[key] !== undefined) el.placeholder = t[key];
        });
        htmlTag.lang = lang === 'zh' ? 'zh-CN' : 'en';
        langToggle.textContent = lang === 'zh' ? 'EN' : '中文';
        renderTemplates();
        renderHistory();
    }

    langToggle.addEventListener('click', function() {
        lang = lang === 'zh' ? 'en' : 'zh';
        applyLang();
        if (imagePreview.src && uploadZone.classList.contains('has-image')) {
            uploadZone.querySelector('.upload-text').innerHTML = i18n[lang].imgSelected;
        }
    });

    vipBtn.addEventListener('click', function() {
        alert(i18n[lang].vipAlert);
    });

    // ===================== 图片上传 + 压缩 =====================
    // 大图先在前端压缩（最长边 1280 / JPEG 85%），上传又快又省 token
    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const MAX_DIM = 1280;
                    let { width, height } = img;
                    if (width > MAX_DIM || height > MAX_DIM) {
                        const scale = MAX_DIM / Math.max(width, height);
                        width = Math.round(width * scale);
                        height = Math.round(height * scale);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = function() { resolve(e.target.result); }; // 压缩失败用原图
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function showPreview(src) {
        imagePreview.src = src;
        previewWrap.classList.add('visible');
        uploadZone.classList.add('has-image');
        uploadZone.querySelector('.upload-icon').textContent = '✅';
        uploadZone.querySelector('.upload-text').innerHTML = i18n[lang].imgSelected;
    }

    function hidePreview() {
        base64Image = null;
        imagePreview.src = '';
        previewWrap.classList.remove('visible');
        uploadZone.classList.remove('has-image');
        uploadZone.querySelector('.upload-icon').textContent = '📁';
        const t = i18n[lang];
        uploadZone.querySelector('.upload-text').innerHTML = t.uploadText + '<strong>' + t.uploadClick + '</strong>';
        imageInput.value = '';
    }

    async function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        base64Image = await compressImage(file);
        showPreview(base64Image);
    }

    imageInput.addEventListener('change', function() { handleFile(this.files[0]); });

    clearBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        hidePreview();
    });

    uploadZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
        handleFile(e.dataTransfer.files[0]);
    });

    // ===================== 赞助（原功能保留） =====================
    sponsorWechat.addEventListener('click', function() {
        qrImage.src = '/static/qr/wechat.svg';
        qrLabel.textContent = lang === 'zh' ? '微信收款码' : 'WeChat Pay';
        qrOverlay.classList.add('visible');
    });

    sponsorAlipay.addEventListener('click', function() {
        qrImage.src = '/static/qr/alipay.svg';
        qrLabel.textContent = lang === 'zh' ? '支付宝收款码' : 'Alipay';
        qrOverlay.classList.add('visible');
    });

    function closeQr() { qrOverlay.classList.remove('visible'); }
    qrClose.addEventListener('click', closeQr);
    qrOverlay.addEventListener('click', function(e) { if (e.target === qrOverlay) closeQr(); });

    // ===================== 历史记录（localStorage） =====================
    const HISTORY_KEY = 'ppt_prompt_history';
    const HISTORY_MAX = 20;

    function loadHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
        catch (e) { return []; }
    }

    function saveHistoryItem(item) {
        const list = loadHistory();
        list.unshift(item);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, HISTORY_MAX)));
        renderHistory();
    }

    function renderHistory() {
        const list = loadHistory();
        historySection.classList.toggle('visible', list.length > 0);
        historyList.innerHTML = '';
        list.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'history-item';
            const meta = document.createElement('div');
            meta.className = 'h-meta';
            const when = new Date(item.ts);
            const pad = n => String(n).padStart(2, '0');
            const label = item.refined ? i18n[lang].refineLabel : i18n[lang].freshLabel;
            meta.textContent = pad(when.getMonth()+1) + '-' + pad(when.getDate()) + ' ' + pad(when.getHours()) + ':' + pad(when.getMinutes()) + ' · ' + label;
            const text = document.createElement('div');
            text.className = 'h-text';
            text.textContent = item.prompt;
            div.appendChild(meta);
            div.appendChild(text);
            // 点击历史：把这条结果放回结果区，并进入优化模式
            div.addEventListener('click', () => {
                lastPrompt = item.prompt;
                resultArea.textContent = item.prompt;
                resultArea.classList.add('has-content');
                updateResultActions(item.prompt);
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            });
            historyList.appendChild(div);
        });
    }

    historyClear.addEventListener('click', function() {
        if (confirm(lang === 'zh' ? '确定清空全部历史记录？' : 'Clear all history?')) {
            localStorage.removeItem(HISTORY_KEY);
            renderHistory();
        }
    });

    // ===================== 结果操作：复制 / 再优化 =====================
    function updateResultActions(text) {
        resultActions.classList.toggle('visible', !!text);
        charCount.textContent = text ? (text.length + ' ' + i18n[lang].chars) : '';
    }

    copyBtn.addEventListener('click', async function() {
        const text = lastPrompt || resultArea.textContent;
        if (!text) return;
        try {
            await navigator.clipboard.writeText(text);
            copyBtn.textContent = i18n[lang].copied;
        } catch (e) {
            // 剪贴板 API 不可用时退回老办法
            const ta = document.createElement('textarea');
            ta.value = text; document.body.appendChild(ta);
            ta.select(); document.execCommand('copy'); ta.remove();
            copyBtn.textContent = i18n[lang].copied;
        }
        setTimeout(() => { copyBtn.textContent = i18n[lang].copy; }, 2000);
    });

    refineBtn.addEventListener('click', function() {
        if (!lastPrompt) return;
        userInput.value = '';
        userInput.placeholder = i18n[lang].refinePlaceholder;
        userInput.focus();
        resultArea.innerHTML = '<span class="thinking">' + i18n[lang].refineHint + '</span>';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ===================== 生成（流式） =====================
    generateBtn.addEventListener('click', async function() {
        if (generating) return;
        const text = userInput.value.trim();
        if (!text && !base64Image) {
            alert(i18n[lang].alertNoInput);
            return;
        }
        // 点过"再优化一版"且有上一版结果 -> 优化模式（带 previous_prompt）
        const isRefine = refineRequested && !!lastPrompt && !!text;
        generating = true;
        generateBtn.disabled = true;
        resultArea.innerHTML = '<span class="thinking">' + i18n[lang].thinking + '</span>';
        resultArea.classList.add('has-content');
        updateResultActions('');
        let full = '';
        try {
            const res = await fetch('/generate/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_input: text,
                    image_base64: base64Image,
                    previous_prompt: isRefine ? lastPrompt : null,
                })
            });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.error || ('HTTP ' + res.status));
            }
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let hadError = false;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const parts = buffer.split('\n\n');
                buffer = parts.pop();
                for (const part of parts) {
                    const line = part.trim();
                    if (!line.startsWith('data:')) continue;
                    let evt;
                    try { evt = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
                    if (evt.error) {
                        resultArea.innerHTML = '<span class="error">' + i18n[lang].errorPrefix + evt.error + '</span>';
                        hadError = true;
                    } else if (evt.delta) {
                        full += evt.delta;
                        resultArea.textContent = full;   // 逐字显示
                        resultArea.scrollTop = resultArea.scrollHeight;
                    }
                }
            }
            if (!hadError && full) {
                lastPrompt = full;
                saveHistoryItem({ ts: Date.now(), prompt: full, refined: isRefine });
                updateResultActions(full);
            } else if (!hadError) {
                resultArea.innerHTML = '<span class="error">' + i18n[lang].errorPrefix + 'empty</span>';
            }
        } catch (err) {
            resultArea.innerHTML = '<span class="error">' + i18n[lang].errorNetwork + err.message + '</span>';
        } finally {
            generating = false;
            generateBtn.disabled = false;
            refineRequested = false;
        }
    });

    let refineRequested = false;
    const _refineBtn = document.getElementById('refineBtn');
    _refineBtn.addEventListener('click', function() { refineRequested = true; });

    // ===================== 设计规范（参考图拆解）+ 出 PPT =====================
    const analyzeBtn = document.getElementById('analyzeBtn');
    const pptxBtn = document.getElementById('pptxBtn');
    const paletteRow = document.getElementById('paletteRow');
    const styleFields = document.getElementById('styleFields');
    let designSpec = { palette: [], style: {} };

    function renderSpec(palette, style) {
        designSpec.palette = (palette || []).map(p => ({ hex: p.hex, name: p.name || '', share: p.share || 0 }));
        designSpec.style = style || {};
        paletteRow.innerHTML = '';
        if (!designSpec.palette.length) {
            paletteRow.innerHTML = '<span class="spec-empty">未提取到配色（参考图可能过小/过灰）。</span>';
        }
        designSpec.palette.forEach((p, i) => {
            const wrap = document.createElement('div');
            wrap.className = 'swatch';
            const inp = document.createElement('input');
            inp.type = 'color';
            inp.value = /^#[0-9a-fA-F]{6}$/.test(p.hex) ? p.hex : '#1F4468';
            inp.addEventListener('input', () => { designSpec.palette[i].hex = inp.value; });
            const lab = document.createElement('div');
            lab.textContent = p.name || '';
            wrap.appendChild(inp); wrap.appendChild(lab);
            paletteRow.appendChild(wrap);
        });
        const st = designSpec.style || {};
        document.getElementById('f-theme').value = st.theme || '';
        document.getElementById('f-layout').value = st.layout || '';
        document.getElementById('f-typography').value = st.typography || '';
        document.getElementById('f-accent').value = st.accent_usage || '';
        styleFields.style.display = 'grid';
    }

    function collectSpec() {
        designSpec.style = {
            theme: document.getElementById('f-theme').value.trim(),
            layout: document.getElementById('f-layout').value.trim(),
            typography: document.getElementById('f-typography').value.trim(),
            accent_usage: document.getElementById('f-accent').value.trim(),
            mood_keywords: (designSpec.style && designSpec.style.mood_keywords) || [],
        };
        return designSpec;
    }

    analyzeBtn.addEventListener('click', async function() {
        if (!base64Image) { alert('请先上传参考图'); return; }
        analyzeBtn.disabled = true; const old = analyzeBtn.textContent; analyzeBtn.textContent = '拆解中…';
        try {
            const res = await fetch('/analyze', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image_base64: base64Image }),
            });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.error || ('HTTP ' + res.status));
            renderSpec(data.palette, data.style);
        } catch (e) {
            alert('拆解失败：' + e.message);
        } finally {
            analyzeBtn.disabled = false; analyzeBtn.textContent = old;
        }
    });

    pptxBtn.addEventListener('click', async function() {
        const text = userInput.value.trim();
        if (!text && !base64Image) { alert('请填写需求或上传参考图'); return; }
        pptxBtn.disabled = true; const old = pptxBtn.innerHTML; pptxBtn.innerHTML = '<span>⏳</span> <span>正在生成 PPT…</span>';
        try {
            const res = await fetch('/deck', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_input: text, image_base64: base64Image, spec: collectSpec() }),
            });
            if (!res.ok) {
                const d = await res.json().catch(() => ({}));
                throw new Error(d.error || ('HTTP ' + res.status));
            }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'DeckCraft.pptx';
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
        } catch (e) {
            alert('生成失败：' + e.message);
        } finally {
            pptxBtn.disabled = false; pptxBtn.innerHTML = old;
        }
    });

    // ===================== 初始化 =====================
    applyLang();
    renderHistory();
</script>
</body>
</html>
